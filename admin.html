<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Админка — Party Rooms</title>
  <meta name="theme-color" content="#141019">
  <link rel="icon" href="favicon.svg?v=mwykqeel" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=mwykqeel">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body class="panel">
  <!-- Вход: один общий пароль администратора (он же — для команды /admin в Telegram) -->
  <main class="login" id="login" hidden>
    <form id="login-form" class="login-card" novalidate>
      <p class="brand">Party Rooms</p>
      <h1>Вход в админку</h1>
      <label class="field"><span>Пароль</span><input id="login-password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit" id="login-btn">Войти</button>
      <p class="error" id="login-error" role="alert"></p>
      <p class="hint">Пароль выдаёт владелец.</p>
    </form>
  </main>

  <main class="content" id="app" hidden>
    <header class="page-head">
      <div><h1>Брони</h1><p class="hint" id="clock"></p></div>
      <div class="actions">
        <button class="btn btn-primary" type="button" id="new-booking">Бронь по звонку или с Авито</button>
        <button class="btn btn-secondary" type="button" id="price-settings">Цены</button>
        <button class="btn btn-secondary" type="button" id="pay-settings">Реквизиты для оплаты</button>
        <button class="link" type="button" id="logout">Выйти</button>
      </div>
    </header>
    <div id="inbox"></div>
    <div class="filters" id="filters">
      <button type="button" class="chip" data-filter="upcoming" aria-pressed="true">Предстоящие</button>
      <button type="button" class="chip" data-filter="done" aria-pressed="false">Завершённые</button>
      <button type="button" class="chip" data-filter="cal" aria-pressed="false">Календарь</button>
    </div>
    <div class="bookings" id="bookings"><p class="empty">Загружаем…</p></div>
  </main>

  <dialog class="modal" id="modal">
    <form method="dialog" class="modal-close"><button class="icon-btn" aria-label="Закрыть">×</button></form>
    <div id="modal-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
